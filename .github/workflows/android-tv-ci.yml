name: Android TV debug verification

on:
  push:
    branches:
      - 88-tv-ux-refresh
  pull_request:
    branches:
      - 87-network-file-manager
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, assemble, and lint debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon --console=plain
      - name: Save debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tv-player-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
